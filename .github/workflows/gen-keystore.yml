name: Gen keystore (one-shot)

# À lancer UNE SEULE FOIS. Produit un keystore de signature stable, encodé en base64,
# à télécharger puis à stocker dans le secret KEYSTORE_BASE64.
# Sans keystore stable, chaque build aurait une signature différente et les
# mises à jour automatiques seraient refusées par Android.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/fork-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'nuviofork2026' }}" \
            -alias "${{ secrets.KEYSTORE_ALIAS || 'nuviofork' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'nuviofork2026' }}" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Nuvio Fork, O=Personal, C=FR"

          base64 -w0 "$RUNNER_TEMP/fork-release.jks" > keystore.b64
          echo "Keystore généré ($(wc -c < keystore.b64) caractères base64)"
          echo "Alias : ${KEYSTORE_ALIAS:-nuviofork}"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
          retention-days: 3
